<app-modal [title]="'Permisos de ' + roleLabel(role().name)" (dismiss)="dismiss.emit()">
  <ul aria-label="Permisos del rol" class="flex flex-wrap gap-2">
    @for (permission of role().permissions; track permission) {
      <li
        class="max-w-full break-words rounded-xl bg-green-50 px-3 py-2 text-xs leading-5 text-green-900 dark:bg-green-950/30 dark:text-green-200">
        {{ permissionLabel(permission) }}
      </li>
    } @empty {
      <li class="text-sm text-stone-500 dark:text-stone-400">Sin permisos</li>
    }
  </ul>
  <div class="mt-7 flex justify-end border-t border-stone-200 pt-5 dark:border-white/10">
    <button
      type="button"
      (click)="dismiss.emit()"
      class="rounded-lg border border-stone-200 px-4 py-3 text-xs dark:border-white/15">
      Cerrar
    </button>
  </div>
</app-modal>
