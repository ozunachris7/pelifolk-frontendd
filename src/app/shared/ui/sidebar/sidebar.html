<div class="flex h-full flex-col bg-white dark:bg-[#171717]">
  <nav
    class="modal-scroll min-h-0 flex-1 overflow-y-auto overscroll-contain px-4 py-6"
    aria-label="Navegación principal">
    @if (overview(); as item) {
      <a
        class="mb-4 flex items-center gap-3 rounded-xl px-4 py-3 text-xs text-stone-500 transition hover:bg-stone-50 focus-visible:outline-2 focus-visible:outline-amber-600 dark:text-stone-400 dark:hover:bg-white/5 [&.active]:bg-green-50 [&.active]:font-semibold [&.active]:text-green-900 dark:[&.active]:bg-white/10 dark:[&.active]:text-green-200"
        [routerLink]="['/dashboard', item.path]"
        [class.active]="active(item.path)"
        [attr.aria-current]="active(item.path) ? 'page' : null"
        (click)="navigate.emit()">
        <lucide-icon [img]="item.icon" [size]="20" aria-hidden="true" /><span>{{
          item.label
        }}</span>
      </a>
    }
    <p
      class="mb-3 px-4 text-[10px] font-medium uppercase tracking-widest text-stone-400 dark:text-stone-500">
      Mi rancho
    </p>
    @for (group of groups(); track group.id) {
      <div class="mb-1">
        <button
          type="button"
          (click)="toggle(group.id)"
          [attr.aria-expanded]="openGroup() === group.id"
          [attr.aria-controls]="'sidebar-' + group.id"
          [attr.data-nav-group]="group.id"
          class="group flex w-full cursor-pointer items-center gap-3 rounded-xl px-4 py-3 text-left text-xs font-medium text-stone-600 transition hover:bg-stone-50 focus-visible:outline-2 focus-visible:outline-amber-600 dark:text-stone-300 dark:hover:bg-white/5">
          <lucide-icon
            [img]="group.icon"
            [size]="20"
            class="shrink-0 text-stone-400"
            aria-hidden="true" />
          <span class="min-w-0 flex-1">{{ group.label }}</span>
          <lucide-icon
            [img]="chevron"
            [size]="14"
            class="shrink-0 text-stone-400 transition-transform duration-200 motion-reduce:transition-none"
            [class.rotate-180]="openGroup() === group.id"
            aria-hidden="true" />
        </button>
        <ul
          [id]="'sidebar-' + group.id"
          [hidden]="openGroup() !== group.id"
          class="my-1 ml-[25px] space-y-1 border-l border-stone-200 py-1 pl-3 dark:border-white/10">
          @for (item of group.items; track item.path) {
            <li>
              <a
                class="flex items-center rounded-lg px-3 py-2.5 text-xs leading-5 text-stone-500 transition hover:bg-stone-50 focus-visible:outline-2 focus-visible:outline-amber-600 dark:text-stone-400 dark:hover:bg-white/5 [&.active]:bg-green-50 [&.active]:font-semibold [&.active]:text-green-900 dark:[&.active]:bg-white/10 dark:[&.active]:text-green-200"
                [routerLink]="['/dashboard', item.path]"
                [class.active]="active(item.path)"
                [attr.aria-current]="active(item.path) ? 'page' : null"
                (click)="navigate.emit()"
                >{{ item.label }}</a
              >
            </li>
          }
        </ul>
      </div>
    }
    @if (reports(); as item) {
      <div class="mt-4 border-t border-stone-100 pt-4 dark:border-white/10">
        <a
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-xs text-stone-500 transition hover:bg-stone-50 focus-visible:outline-2 focus-visible:outline-amber-600 dark:text-stone-400 dark:hover:bg-white/5 [&.active]:bg-green-50 [&.active]:font-semibold [&.active]:text-green-900 dark:[&.active]:bg-white/10 dark:[&.active]:text-green-200"
          [routerLink]="['/dashboard', item.path]"
          [class.active]="active(item.path)"
          [attr.aria-current]="active(item.path) ? 'page' : null"
          (click)="navigate.emit()">
          <lucide-icon [img]="item.icon" [size]="20" aria-hidden="true" /><span>{{
            item.label
          }}</span>
        </a>
      </div>
    }
  </nav>
  <div
    class="mx-6 shrink-0 border-t border-stone-100 py-5 text-xs font-semibold dark:border-white/10">
    Pelifolk <span class="mt-1 block text-[10px] font-normal text-stone-400">Gestión del hato</span>
  </div>
</div>
